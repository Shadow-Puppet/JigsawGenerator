<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Pattern Generator</title>
  </head>
  <body>
    <div id="loading">Loading WASM module...</div>
    <div id="app" style="display: none">
      <h1>Puzzle Pattern Generator</h1>
      <p>Enter grid dimensions to compute the piece type breakdown.</p>
      <form id="form">
        <div class="input-group">
          <label for="rows">Rows</label>
          <input type="number" id="rows" value="3" min="1" />
        </div>
        <div class="input-group">
          <label for="cols">Columns</label>
          <input type="number" id="cols" value="4" min="1" />
        </div>
        <button type="submit" id="compute">Compute</button>
      </form>
      <div id="result"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
