<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Pattern Generator</title>
  </head>
  <body>
    <div id="loading">Loading WASM module...</div>
    <div id="app" style="display: none">
      <div class="layout">
        <aside class="controls-panel">
          <h1>Puzzle Pattern Generator</h1>

          <section class="control-section">
            <h2 class="section-header">Grid Size <label class="pill-toggle" title="Lock grid size"><svg class="pill-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0" class="lock-shackle"/></svg><input type="checkbox" id="grid-lock" /><span class="pill-track"><span class="pill-knob"></span></span></label></h2>
            <div class="control-row piece-count-row">
              <div class="input-group">
                <label for="piece-target">Piece Count</label>
                <input type="number" id="piece-target" min="4" max="10000" value="48" />
              </div>
            </div>
            <div class="control-row">
              <div class="input-group">
                <label for="rows">Rows</label>
                <input type="number" id="rows" min="2" max="100" value="6" />
              </div>
              <div class="input-group">
                <label for="cols">Columns</label>
                <input type="number" id="cols" min="2" max="100" value="8" />
              </div>
            </div>
            <ul id="piece-size-warning" class="piece-size-warning"></ul>
          </section>

          <section class="control-section">
            <h2 class="section-header">Dimensions <label class="pill-toggle" title="Lock dimensions"><svg class="pill-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0" class="lock-shackle"/></svg><input type="checkbox" id="dims-lock" /><span class="pill-track"><span class="pill-knob"></span></span></label></h2>
            <div class="control-row">
              <div class="input-group">
                <label for="width">Width</label>
                <input type="number" id="width" min="1" step="0.1" value="297" />
              </div>
              <div class="input-group">
                <label for="height">Height</label>
                <input type="number" id="height" min="1" step="0.1" value="210" />
              </div>
              <div class="input-group">
                <label for="unit">Unit</label>
                <select id="unit">
                  <option value="Millimeters">mm</option>
                  <option value="Inches">inches</option>
                </select>
              </div>
            </div>
          </section>

          <section class="control-section">
            <h2 class="section-header">Border Shape</h2>
            <div class="control-row">
              <div class="input-group" style="flex:1">
                <select id="border-shape">
                  <option value="">Rectangle</option>
                  <option value="heart">Heart</option>
                  <option value="star">Star</option>
                </select>
              </div>
            </div>
          </section>

          <section class="control-section">
            <h2 class="section-header">Parameters</h2>
            <div class="slider-group" id="tab-group">
              <div class="slider-label">
                <span class="label-with-toggle">
                  <label for="tab">Tab Size</label>
                  <label class="pill-toggle pill-toggle-sm" title="Randomize per edge">
                    <svg class="pill-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"/><circle cx="5.5" cy="5.5" r="0.75" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="0.75" fill="currentColor" stroke="none"/><circle cx="10.5" cy="10.5" r="0.75" fill="currentColor" stroke="none"/></svg>
                    <input type="checkbox" id="tab-randomize" />
                    <span class="pill-track"><span class="pill-knob"></span></span>
                  </label>
                </span>
                <span class="readout" id="tab-readout">20%</span>
              </div>
              <div class="range-slider-container" id="tab-track">
                <input type="range" id="tab" min="0.15" max="0.20" step="0.01" value="0.20" />
                <input type="range" id="tab-max" min="0.15" max="0.20" step="0.01" value="0.20" class="range-max" style="display:none" />
              </div>
            </div>
            <div class="slider-group" id="taper-group">
              <div class="slider-label">
                <span class="label-with-toggle">
                  <label for="taper">Taper</label>
                  <label class="pill-toggle pill-toggle-sm" title="Randomize per edge">
                    <svg class="pill-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"/><circle cx="5.5" cy="5.5" r="0.75" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="0.75" fill="currentColor" stroke="none"/><circle cx="10.5" cy="10.5" r="0.75" fill="currentColor" stroke="none"/></svg>
                    <input type="checkbox" id="taper-randomize" />
                    <span class="pill-track"><span class="pill-knob"></span></span>
                  </label>
                </span>
                <span class="readout" id="taper-readout">0.00</span>
              </div>
              <div class="range-slider-container" id="taper-track">
                <input type="range" id="taper" min="0" max="1" step="0.01" value="0" />
                <input type="range" id="taper-max" min="0" max="1" step="0.01" value="0" class="range-max" style="display:none" />
              </div>
            </div>
            <div class="slider-group" id="offset-group">
              <div class="slider-label">
                <label for="offset">Tab Offset</label>
                <span class="readout" id="offset-readout">0.00</span>
              </div>
              <input type="range" id="offset" min="0" max="0.10" step="0.01" value="0" />
            </div>
          </section>

          <section class="control-section">
            <h2 class="section-header">Seed</h2>
            <div class="seed-row">
              <input type="text" id="seed" placeholder="Enter seed..." />
              <button type="button" id="randomize" title="Randomize seed">&#9860;</button>
            </div>
          </section>

          <div class="actions">
            <button type="button" id="download" class="btn-primary">Download SVG</button>
            <button type="button" id="copy-link" class="btn-secondary">Copy Link</button>
          </div>
        </aside>

        <main class="preview-area">
          <div id="dimension-ruler">
            <span id="ruler-width" class="ruler-label"></span>
            <span class="ruler-x">&times;</span>
            <span id="ruler-height" class="ruler-label"></span>
          </div>
          <div id="svg-viewport">
            <canvas id="puzzle-canvas"></canvas>
          </div>
          <div class="preview-footer">
            <p id="piece-count"></p>
            <div id="zoom-controls">
              <button type="button" id="zoom-in" title="Zoom in">+</button>
              <span id="zoom-level">100%</span>
              <button type="button" id="zoom-out" title="Zoom out">&minus;</button>
              <button type="button" id="zoom-reset" title="Fit to width">&#8865;</button>
            </div>
          </div>
          <p id="error-display"></p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
