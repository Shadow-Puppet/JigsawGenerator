[package]
name = "puzzle-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
puzzle-core = { path = "../puzzle-core" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
